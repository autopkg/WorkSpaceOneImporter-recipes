repos:
    - repo: https://github.com/psf/black-pre-commit-mirror
      rev: 26.10.0
      hooks:
          - id: black
    - repo: https://github.com/PyCQA/isort
      rev: 9.0.2
      hooks:
          - id: isort
            args: ["--profile", "black"]
    - repo: https://github.com/pycqa/flake8
      rev: 7.4.1
      hooks:
          - id: flake8
    -   repo: https://github.com/homebysix/pre-commit-macadmin
        rev: v1.25.1
        hooks:
            -   id: check-plists
            -   id: check-autopkg-recipes
                args: ['--strict']

