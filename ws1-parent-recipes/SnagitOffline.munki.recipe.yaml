Description: |
  Imports the TechSmith Snagit offline-licensing ("Passive") build into Munki and installs the offline licence.

  Set WS1_SNAGIT_LICENSE_KEY to the licence (contents of the LicensePassive file from TechSmith), preferably through
  the AUTOPKG_WS1_SNAGIT_LICENSE_KEY environment variable; never commit it. TechSmith's design requires the licence
  in /Users/Shared/TechSmith/Snagit/LicensePassive with /Users/Shared/TechSmith recursively world-writable, because
  Snagit (running as the user) activates each new app version there. The key therefore ends up in the pkginfo and
  is readable by every user of the Mac.

  The installs array holds Snagit.app only, compared on CFBundleShortVersionString, and cannot tell the consumer and
  offline-licensing builds apart. These recipes do not support mixing the two builds on the same Macs: a consumer
  install of the same or a newer version counts as installed and is not replaced, and both builds share the same
  app path, so mixing them leads to undesired behaviour. Target each group of Macs with only one of the two builds.
Identifier: com.github.codeskipper.munki.SnagitOffline
ParentRecipe: com.github.codeskipper.download.SnagitOffline
MinimumVersion: '2.3'

Input:
  NAME: TechSmith Snagit
  WS1_SNAGIT_LICENSE_KEY: LICENSE_KEY_HERE
  MUNKI_REPO_SUBDIR: apps/TechSmith

  pkginfo:
    blocking_applications:
    - Snagit
    catalogs:
    - testing
    category: Productivity
    description: |
      The best software for screen capture and recording.

      Easily grab screenshots or record your screen, then add annotations to communicate your message clearly.
    developer: TechSmith
    display_name: TechSmith Snagit
    name: '%NAME%'
    unattended_install: true
    unattended_uninstall: true
    uninstallable: true
    uninstall_method: uninstall_script
    preinstall_script: |
      #!/bin/zsh
      # Running Snagit is handled by Munki blocking_applications (install deferred until the app is quit).
      # Resets Snagit activation state so the new version re-activates from LicensePassive (postinstall);
      # scoped to the Snagit subfolder so other TechSmith apps in /Users/Shared/TechSmith are left alone.

      # migration cleanup: legacy Snagit 2024 bundle and receipt
      rm -rf "/Applications/Snagit 2024.app"
      pkgutil --forget "com.TechSmith.Snagit2024" >/dev/null 2>&1

      rm -rf "/Users/Shared/TechSmith/Snagit"

      exit 0
    postinstall_script: |
      #!/bin/zsh
      # TechSmith requires the licence in /Users/Shared/TechSmith/Snagit with /Users/Shared/TechSmith recursively
      # world-writable:
      # Snagit, running as the user, writes there to activate the licence per app version.
      set -euo pipefail

      license_file_loc="/Users/Shared/TechSmith/Snagit"
      license_file_name="LicensePassive"

      # quoted heredoc: the key is used verbatim, no $/`/\ expansion by zsh
      license_key=$(cat <<'EOF'
      %WS1_SNAGIT_LICENSE_KEY%
      EOF
      )
      case "$license_key" in
        ""|none|*_HERE|*%WS1_SNAGIT_LICENSE_KEY*)
          echo "Snagit licence key was not set when this item was built; LicensePassive not written." >&2
          exit 1
          ;;
      esac

      mkdir -p "$license_file_loc"
      print -r -- "$license_key" >"$license_file_loc/$license_file_name"
      # recursive, after writing the key: on first launch Snagit (as the user) creates Snagit/License to activate;
      # without write access to the Snagit subfolder the licence does not activate
      chmod -R 777 /Users/Shared/TechSmith
    uninstall_script: |
      #!/bin/zsh
      # Running Snagit is handled by Munki blocking_applications (removal deferred until the app is quit).

      rm -rf "/Applications/Snagit.app"

      # licence key + activation state; scoped to Snagit so other TechSmith apps are left alone
      rm -rf "/Users/Shared/TechSmith/Snagit"

      # stale receipt (version "0") left by earlier vendor-PKG installs; DMG installs create none
      pkgutil --forget "com.TechSmith.Snagit" >/dev/null 2>&1

      exit 0

Process:
- Processor: Copier
  Arguments:
    source_path: '%pathname%/Snagit.app'
    destination_path: '%RECIPE_CACHE_DIR%/payload/Applications/Snagit.app'
    overwrite: true

- Processor: MunkiInstallsItemsCreator
  Arguments:
    faux_root: '%RECIPE_CACHE_DIR%/payload'
    installs_item_paths:
    - /Applications/Snagit.app
    version_comparison_key: CFBundleShortVersionString
    derive_minimum_os_version: true

- Processor: MunkiPkginfoMerger

- Processor: MunkiImporter
  Arguments:
    pkg_path: '%pathname%'
    repo_subdirectory: '%MUNKI_REPO_SUBDIR%'

- Processor: PathDeleter
  Arguments:
    path_list:
    - '%RECIPE_CACHE_DIR%/payload'
